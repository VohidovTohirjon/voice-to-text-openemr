<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Noto'g'ri eshitilgan dori nomi uchta o'lchov bilan tiklanadi: yozilish o'xshashligi, talaffuz o'xshashligi va undoshlar skeleti. Butunlay buzilgan nom tiklanmaydi." viewBox="0 0 900 400" width="900" height="400" font-family="Archivo, Helvetica Neue, Arial, sans-serif">
<rect width="900" height="400" fill="#F6F7F4"/>
<defs>
  <marker id="dA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" fill="#14201C"/>
  </marker>
</defs>

<text x="30" y="36" font-size="21" font-weight="800" fill="#14201C">Noto&#39;g&#39;ri eshitilgan dori nomini tiklash</text>
<text x="30" y="58" font-size="13" fill="#5C6B65">Uchta mustaqil o&#39;lchov birlashtiriladi &#8212; hech biri yolg&#39;iz yetarli emas</text>

<rect x="30" y="160" width="190" height="80" rx="8" fill="#F9EADB" stroke="#A05007" stroke-width="1.8"/>
<text x="125" y="192" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="16" font-weight="500" fill="#14201C">lisinapril</text>
<text x="125" y="215" text-anchor="middle" font-size="11.5" fill="#5C6B65">tizim shunday eshitdi</text>

<line x1="228" y1="200" x2="258" y2="200" stroke="#14201C" stroke-width="1.6" marker-end="url(#dA)"/>

<text x="270" y="112" font-size="13" font-weight="700" fill="#14201C">Yozilish o&#39;xshashligi</text>
<text x="270" y="130" font-family="JetBrains Mono, Menlo, monospace" font-size="10.5" fill="#5C6B65">harflar ketma-ketligi qanchalik mos</text>
<rect x="270" y="138" width="240" height="10" rx="5" fill="#E4E9E5"/>
<rect x="270" y="138" width="228" height="10" rx="5" fill="#0E6B58"/>
<text x="524" y="147" font-family="JetBrains Mono, Menlo, monospace" font-size="12.5" fill="#14201C">95%</text>
<text x="586" y="147" font-family="JetBrains Mono, Menlo, monospace" font-size="11.5" fill="#5C6B65">&#215; 55</text>

<text x="270" y="188" font-size="13" font-weight="700" fill="#14201C">Talaffuz o&#39;xshashligi</text>
<text x="270" y="206" font-family="JetBrains Mono, Menlo, monospace" font-size="10.5" fill="#5C6B65">quloqqa qanchalik bir xil eshitiladi</text>
<rect x="270" y="214" width="240" height="10" rx="5" fill="#E4E9E5"/>
<rect x="270" y="214" width="180" height="10" rx="5" fill="#0E6B58"/>
<text x="524" y="223" font-family="JetBrains Mono, Menlo, monospace" font-size="12.5" fill="#14201C">75%</text>
<text x="586" y="223" font-family="JetBrains Mono, Menlo, monospace" font-size="11.5" fill="#5C6B65">&#215; 20</text>

<text x="270" y="264" font-size="13" font-weight="700" fill="#14201C">Undoshlar skeleti</text>
<text x="270" y="282" font-family="JetBrains Mono, Menlo, monospace" font-size="10.5" fill="#5C6B65">unlilar tashlanadi &#8212; xatolar aynan unlida</text>
<rect x="270" y="290" width="240" height="10" rx="5" fill="#E4E9E5"/>
<rect x="270" y="290" width="221" height="10" rx="5" fill="#0E6B58"/>
<text x="524" y="299" font-family="JetBrains Mono, Menlo, monospace" font-size="12.5" fill="#14201C">92%</text>
<text x="586" y="299" font-family="JetBrains Mono, Menlo, monospace" font-size="11.5" fill="#5C6B65">&#215; 25</text>

<line x1="640" y1="200" x2="670" y2="200" stroke="#14201C" stroke-width="1.6" marker-end="url(#dA)"/>

<rect x="680" y="160" width="190" height="80" rx="8" fill="#E1EFEB" stroke="#0E6B58" stroke-width="2"/>
<text x="775" y="192" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="16" font-weight="500" fill="#14201C">lisinopril</text>
<text x="775" y="215" text-anchor="middle" font-size="11.5" fill="#0E6B58">94% moslik</text>

<rect x="30" y="330" width="840" height="52" rx="8" fill="#FFFFFF" stroke="#A05007" stroke-width="1.4"/>
<rect x="30" y="330" width="5" height="52" rx="2.5" fill="#A05007"/>
<text x="52" y="352" font-size="13" font-weight="700" fill="#14201C">Chegara: butunlay buzilgan nomni hech qanday o&#39;lchov tiklay olmaydi.</text>
<text x="52" y="370" font-size="12.5" fill="#5C6B65">Haqiqiy sinovda &#8220;acetaminophen&#8221; &#8594; &#8220;a seed of minifin&#8221; bo&#39;ldi. Bu yerda tibbiy model kerak.</text>
</svg>
