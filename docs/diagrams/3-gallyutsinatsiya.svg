<text x="52" y="384" font-size="14.5" font-weight="700" fill="#14201C">Birortasi ishlasa &#8212; segment qizil belgilanadi va shifokor tekshiradi</text>
<text x="52" y="403" font-size="12.5" fill="#5C6B65">Hech qachon jim o&#39;tkazilmaydi. Tibbiy yozuvda to&#39;qilgan gap yo&#39;q gapdan xavfliroq &#8212; u fakt bo&#39;lib o&#39;qiladi.</text>
