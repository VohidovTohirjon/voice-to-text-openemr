<text x="337" y="132" font-size="15" font-weight="700" fill="#14201C">2 &#183; Takrorlanish</text>
<text x="337" y="154" font-size="11.5" fill="#5C6B65">Bir ibora necha marta qaytdi</text>
<text x="337" y="170" font-size="11.5" fill="#5C6B65">va matnning qancha qismi</text>
<text x="337" y="198" font-family="JetBrains Mono, Menlo, monospace" font-size="9.5" letter-spacing="0.08em" fill="#5C6B65">CHEGARA</text>
<text x="337" y="216" font-family="JetBrains Mono, Menlo, monospace" font-size="12.5" fill="#14201C">3+ marta, 40%+ qamrov</text>
<line x1="337" y1="234" x2="563" y2="234" stroke="#E4E9E5"/>
<text x="337" y="256" font-family="JetBrains Mono, Menlo, monospace" font-size="9.5" letter-spacing="0.08em" fill="#5C6B65">NIMANI USHLAYDI</text>
<text x="337" y="274" font-size="12" fill="#14201C">Model tsiklga tushib, bir</text>
<text x="337" y="290" font-size="12" fill="#14201C">iborani qayta-qayta yozishi</text>
<text x="337" y="308" font-size="11" fill="#A05007">bizda: &#8220;follow up&#8221; &#215; 5</text>

<!-- 3 -->
