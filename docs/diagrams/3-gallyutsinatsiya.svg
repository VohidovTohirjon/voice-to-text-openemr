<text x="52" y="256" font-family="JetBrains Mono, Menlo, monospace" font-size="9.5" letter-spacing="0.08em" fill="#5C6B65">NIMANI USHLAYDI</text>
<text x="52" y="274" font-size="12" fill="#14201C">Noaniq talaffuz, shovqin,</text>
