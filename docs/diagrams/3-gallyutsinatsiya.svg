<text x="622" y="256" font-family="JetBrains Mono, Menlo, monospace" font-size="9.5" letter-spacing="0.08em" fill="#5C6B65">NIMANI USHLAYDI</text>
<text x="622" y="274" font-size="12" fill="#14201C">Jimlik ustidan to&#39;qib</text>
<text x="622" y="290" font-size="12" fill="#14201C">chiqarilgan ravon matn</text>
<text x="622" y="308" font-size="11" fill="#5C6B65">Whisper&#39;ning ma&#39;lum artefakti</text>

