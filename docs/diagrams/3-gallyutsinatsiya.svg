<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Uchta mustaqil nazorat: dekoder ishonchi, takrorlanish va sukunat ehtimoli. Birortasi ishlasa segment tekshirishga belgilanadi va hech qachon jim o'tkazilmaydi." viewBox="0 0 900 428" width="900" height="428" font-family="Archivo, Helvetica Neue, Arial, sans-serif">
