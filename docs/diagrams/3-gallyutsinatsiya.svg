<text x="52" y="308" font-size="11" fill="#A05007">bizda: &#8220;140 over 90&#8221; &#8212; 26%</text>

<!-- 2 -->
<rect x="315" y="104" width="270" height="212" rx="9" fill="#FFFFFF" stroke="#C9D2CB" stroke-width="1.4"/>
